planning_groups:
  left_arm:
    joints: *id001
    tip_link: openarm_left_ee_base_link
    reference_frame: world
  right_arm:
    joints: *id002
    tip_link: openarm_right_ee_base_link
    reference_frame: world
  left_gripper:
    joints: *id003
  right_gripper:
    joints: *id004
mounting:
  parent_frame: world
  base_link: openarm_body_link0
  joint: openarm_body_link0_mount_joint
  mount_height_m: 0.42
  joint_type: fixed
reference_frames:
  world:
    description: MoveIt planning frame and supported relative-motion frame
    axes:
      x: world_positive_x
      y: world_positive_y
      z: world_up
task_descriptions:
  openarm.arm.move_relative:
    description: Translate one selected end effector in the world frame
    allowed_arms:
    - left
    - right
    planning_groups:
    - left_arm
    - right_arm
    tip_links:
      left: openarm_left_ee_base_link
      right: openarm_right_ee_base_link
    relevant_joints:
      left: *id001
      right: *id002
    workspace_hint: Requests are limited to 20 mm per action and must produce a complete
      Cartesian path
    collision_warning: Current integration defaults avoid_collisions to false and
      has no configured Octomap 3D sensor
  openarm.gripper.move:
    description: Move one selected parallel gripper to an absolute opening target
    allowed_sides:
    - left
    - right
    planning_groups:
    - left_gripper
    - right_gripper
    driver_joints:
      left: openarm_left_finger_joint1
      right: openarm_right_finger_joint1
    mimic_joints:
      left: openarm_left_finger_joint2
      right: openarm_right_finger_joint2
    target_range_m:
    - 0.0
    - 0.044
    simulation_only: true
  openarm.pick_demo:
    description: Pick and lift the deterministic demo block with the right gripper
    allowed_sides:
    - right
    allowed_objects:
    - pick_demo_block
    planning_groups:
    - right_arm
    - right_gripper
    object_pose_topic: /openarm/pick_demo/object_pose
    minimum_verified_object_rise_m: 0.008
    simulation_only: true
known_limitations:
- Arm motion supports only relative Cartesian translation
- Gripper motion supports only absolute opening targets
- Absolute pose and HOME operations are not implemented
- Right arm starts near its downward Cartesian workspace boundary
- No Octomap 3D sensor plugin is configured
