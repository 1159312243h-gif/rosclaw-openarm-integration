# Official OpenArm v2 bimanual assembly with the official parallel-link gripper.
robot:
  root_frame: world
  components:
    - body
    - primary_arm
    - secondary_arm
    - primary_arm_end_effector
    - secondary_arm_end_effector

body:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: body
  inertials: nominal
  link_name: openarm_body_link0
  connection:
    parent: world
    origin:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  reflect: {x: 1, y: 1, z: 1}
  limit_override_joints: {}

primary_arm:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: arm
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: body
    parent_reference_point: left_arm_mount_point
    parent: null
    origin: null
  reflect:
    x: 1
    y: -1
    z: 1
    include:
      links: [base_link, link1, link2, link5, link6, link7]
      joints: [joint1, joint2, joint3, joint5, joint6, joint7]
      reference_points: [ee_mount_point]
  limit_override_joints:
    joint7: {lower: -0.7854, upper: 0.7854, effort: 7, velocity: 20.944}

secondary_arm:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: arm
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: body
    parent_reference_point: right_arm_mount_point
    parent: null
    origin: null
  reflect: {x: 1, y: 1, z: 1}
  limit_override_joints:
    joint7: {lower: -0.7854, upper: 0.7854, effort: 7, velocity: 20.944}

primary_arm_end_effector:
  type: end_effector
  enabled: true
  product: parallel_link
  config: null
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: primary_arm
    parent_reference_point: ee_mount_point
    parent: null
    # The formal parallel-gripper frame is Rx(pi) at the arm link7 origin.
    origin: &parallel_mount_origin
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 3.141592653589793
      pitch: 0.0
      yaw: 0.0
  reflect: {x: 1, y: 1, z: 1}
  limit_override_joints: {}

secondary_arm_end_effector:
  type: end_effector
  enabled: true
  product: parallel_link
  config: null
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: secondary_arm
    parent_reference_point: ee_mount_point
    parent: null
    origin: *parallel_mount_origin
  reflect: {x: 1, y: 1, z: 1}
  limit_override_joints: {}
