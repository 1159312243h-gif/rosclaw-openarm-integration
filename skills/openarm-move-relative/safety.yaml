schema_version: "rosclaw.safety.v1"

runtime_mode:
  default: "sandbox_first"
  allowed:
    - dry_run
    - replay
    - sandbox

hard_constraints:
  robot:
    min_battery_percent: 0
    require_estop_ready: false
  action:
    max_linear_velocity_mps: 0.10
    max_translation_norm_m: 0.02
    allowed_arms: [left, right]
    reference_frame: world
  environment:
    disallow_unknown_obstacles: true

robot:
  min_battery_percent: 0
  require_estop_ready: false

action:
  max_linear_velocity_mps: 0.10
  max_translation_norm_m: 0.02

environment:
  disallow_unknown_obstacles: true

sandbox:
  required_checks:
    - collision_check
    - joint_limit_check
    - moveit_cartesian_planning_observed
    - moveit_execute_trajectory_observed
    - follow_joint_trajectory_observed
    - physics_executed
    - final_translation_verification
  block_on:
    - collision_risk_high
    - joint_limit_violation
    - moveit_unavailable
    - moveit_evidence_incomplete
    - physics_unavailable
    - final_translation_error

failure_policy:
  on_sandbox_block: "abort_and_explain"
  on_low_confidence: "verify_or_abort"
  on_repeated_failure: "stop"
  max_runtime_retries: 0
